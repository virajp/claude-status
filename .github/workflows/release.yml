name: Release

# Builds the binary and publishes it as GitHub Release assets. The release IS
# the distribution: per target a `.tar.gz` with the binary at its root — what a
# Homebrew formula consumes — plus the raw binary for people who want it
# directly, and a SHA256SUMS manifest covering both.
#
# Triggered two ways:
#   1. a pushed version tag (v*)   — the normal release path
#   2. workflow_dispatch           — manual re-run against an existing tag
#
# THE REGISTRY STEP IS BACK, and narrowly. `distribution/01` retired npm as a
# channel because shipping a Rust binary through it asked every user for a Node
# toolchain to deliver something that needs none, and made this repo
# two-language to serve one artifact. `publish-npm` below publishes an
# INSTALLER instead — no binary, no build, no dependencies — which downloads the
# asset this workflow just uploaded and refuses it unless it matches a digest
# stamped in from that release's own SHA256SUMS. `docs/decisions.md` carries
# both halves of the reversal. `id-token: write` returns with it, on that one
# job rather than on the workflow.
#
# ONE version. Cargo.toml owns it: the binary self-reports it, and `verify`
# below checks the tag against it before anything is built.
#
# `--clobber` on the upload path makes a re-run *recoverable* — a partially
# failed release is safe to retry, and the assets that land are correct.
#
# A re-run is also byte-identical, which is a separate promise and the one
# `distribution/02`'s formula will rest on. It did not used to be: archiving
# with `-z` embedded the member's mtime, the runner's owner and group, and
# gzip's own header timestamp, so a rebuild of identical contents produced a
# different sha256. Once a formula pins that digest, such a retry breaks
# `brew install` for everyone with nothing to signal it.
#
# `reproducible_tar` in `_scripts/_rust` removes all three, and `tests/release.rs`
# holds it there by running it. **This cycle owns that fix, not
# `distribution/02`** — the order was reversed, because `02` needs a published
# asset to pin and only a release produces one.
#
# The GNU-versus-bsdtar worry recorded here previously does not apply: it
# assumed `--sort=name`, which is meaningless for a single-member archive. The
# flags actually used are accepted by both, verified on bsdtar 3.5.3.
#
# ---------------------------------------------------------------------------
# ONE TAG LINE, TWO VERSION NUMBERS
# ---------------------------------------------------------------------------
#
# `v*` releases the binary, bumps the tap, and publishes the npx installer
# alongside it — a new binary is no use on that channel until the package
# points at it.
#
# **The installer is published under its OWN number**, whatever
# `npm/package.json` carries, not under the crate's. The two were one number
# while the package carried the binary; it downloads one now, and an artifact
# that fetches another artifact should not claim to be it. `npm/asset.json`
# inside the published package records which binary it installs, so the
# relationship is written down rather than implied by two numbers matching.
# `docs/decisions.md` holds both halves.
#
# **So a release bumps two manifests**: `Cargo.toml` and `npm/package.json`.
# npm cannot republish a version, so the installer needs a new number every time
# it is published, which is every time the binary is released. Forget it and the
# publish is refused against a release that is already complete — recoverable by
# bumping and re-running this job.
#
# An `npm-v*` line that published the installer WITHOUT a binary release existed
# for part of 2026-08-30 and was removed the same day; `docs/decisions.md`
# records what it was for and why it went.
#
# To release: bump `version` in `Cargo.toml` AND `npm/package.json`, commit,
# then push a matching `v` tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  # `contents: write` creates the release and uploads the binaries to it, and is
  # the only permission every job here needs. `publish-npm` declares its own —
  # `id-token: write`, with `contents` narrowed back to `read` — because a
  # job-level block replaces this one outright, and nothing else in this
  # workflow should be able to mint an OIDC identity.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  # No test may reach the real spend endpoint: the credential store is not
  # scoped by $HOME, so a stray fetch is a privacy leak and a rate limit.
  CLAUDE_STATUS_SPEND_URL: http://127.0.0.1:1/never

jobs:
  # The tag has to agree with Cargo.toml before anything is built, so a
  # mismatched release fails in seconds rather than after both builds.
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # The changelog is walked over the commit history, and `checkout` is
          # shallow by default — depth 1 yields an empty changelog rather than
          # an error, which is the worst way for this to fail.
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      # `main` is the release branch. A `v*` tag cut from `develop` would build
      # and publish code that was never merged, and the version it claims would
      # not be the version `main` describes.
      #
      # `--is-ancestor` rather than an equality check on the ref: the tag may
      # sit behind `main` if work landed after it was cut, and that is a valid
      # release of an earlier commit. What is refused is a commit that is not on
      # `main` at all.
      #
      # The explicit fetch is load-bearing — `checkout` at a tag ref does not
      # bring `origin/main` with it, `fetch-depth: 0` notwithstanding, so the
      # comparison would otherwise fail on a missing ref rather than on merit.
      - name: Refuse a tag that is not on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main — merge develop into main, then re-cut the tag"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is contained in main"

      - name: Verify the tag matches Cargo.toml
        id: version
        run: |
          pkg="$(cargo pkgid | sed -E 's/.*[@#]([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/')"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $pkg"
              exit 1
            fi
          fi
          echo "Releasing claude-status $pkg"

      - name: Generate the release notes
        run: |
          set -e
          mkdir -p notes
          git-conventional-commits changelog \
            --config .config/git-conventional-commits.yaml \
            --release "${{ steps.version.outputs.version }}" \
            > notes/RELEASE_NOTES.md
          echo "--- generated notes ---"
          cat notes/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes/RELEASE_NOTES.md

  # The full suite once per **published architecture**, not once per OS. One
  # runner per row of `supported_targets` keeps every artifact that reaches a
  # release backed by a suite that ran on its own architecture. There is one row
  # today, so there is one runner — the rule has not changed, the table has.
  #
  # Re-adding a target means adding its runner here AND to the build matrix
  # below. Contract §9 makes that the bar for adding one at all: a target whose
  # binary is built but never executed is a claim nobody checked.
  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # No `install_args`. Scoping the install here was a mistake, and CI is
      # what showed it: with `install_args: rust dprint`, three runs of the
      # SAME commit minutes apart produced clippy twice and not the third time,
      # where rustup resynced the toolchain at lint time and reported
      # "downloading 3 components" — a `minimal` profile, not the `default`
      # this repo's config asks for.
      #
      # Whether the arg drops the tool's `profile` option or interacts with the
      # action's cache was not isolated. It does not need to be: the risk being
      # traded away was an extra tool download, and the risk taken on was a
      # release gate that fails at random. Installing the declared set is what
      # reliably applies `profile = "default"`.
      - uses: jdx/mise-action@v4

      # Cheap, and it guards the config that decides whether the lint below
      # even has a linter — which is how the first release failed.
      - name: Check the shared toolchain
        run: mise run code:toolchain

      # **The same belt-and-braces `ci.yml` carries, and this job wanted it
      # more.** Dropping `install_args` above made the `minimal`-profile resync
      # rarer, not impossible. `ci.yml` was given this line on 2026-08-27 after
      # the flake survived that fix; release.yml was not, and on the very next
      # tag — v1.1.0 — it failed here with
      # "'cargo-clippy' is not installed for the toolchain '1.98.0'", having
      # just logged "downloading 3 components". `publish` and `bump-tap` were
      # skipped, so a release nobody could distinguish from a broken one was
      # lost to a third-party download profile.
      #
      # That is the worse half of the trade the comment above describes: on a
      # pull request this costs a re-run, on a tag it costs the release. The
      # two workflows had different exposure and the same bug, and only one was
      # fixed.
      #
      # `rustup component add` is idempotent and costs nothing when the
      # component is already present.
      - name: Ensure clippy is actually installed
        run: rustup component add clippy

      - name: Lint
        run: mise run code:lint

      - name: Test
        run: mise run code:test

  # One target per natively-matching runner, so nothing is cross-compiled and no
  # C toolchain has to be arranged for the TLS stack the spend subsystem adds.
  # Kept in step with `supported_targets` in .config/mise/tasks/_scripts/_rust.
  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      - name: Build ${{ matrix.target }}
        run: mise run build:statusline --target ${{ matrix.target }}

      # The binary is what ships, so prove this exact file answers `--version`
      # with the bare crate version. This job is one of the two consumers that
      # make that guarantee load-bearing — `build:statusline`'s smoke test is
      # the other — and it is why contract §5 still pins the output's shape now
      # that the npm installer no longer reads it.
      - name: Verify the built binary
        run: |
          bin="target/${{ matrix.target }}/release/claude-status"
          reported="$("$bin" --version)"
          if [ "$reported" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::$bin reports $reported, expected ${{ needs.verify.outputs.version }}"
            exit 1
          fi
          echo "$bin -> $reported"

      # **The uploaded file carries its target in its name.** Every target
      # builds a binary called `claude-status`, so an artifact set that keeps
      # that name can only be told apart by the directory it lands in — and
      # that directory is decided by `download-artifact`, whose rule for it
      # changed under us (see the download step in `publish`). Staging under a
      # unique name moves the distinction into the filename, where nothing
      # outside this repository gets a vote.
      - name: Stage the binary under a target-unique name
        run: |
          set -e
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/claude-status" \
             "dist/claude-status-${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/claude-status-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ verify, test, build ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # `install: false` — this job installs nothing, because it uses nothing.
      # `_rust_reassemble` is bash, the collect step is bash plus `shasum` and
      # `tar`, and the release step is `gh`, which the runner image ships.
      #
      # This matters because `publish` runs AFTER `test` and `build` have spent
      # their minutes and produced an artifact. A tool download failing here is
      # a green build with no release — and that is precisely how 2026-08-22
      # failed, with `mise-action` dying on `pnpm` before any repo command ran.
      - uses: jdx/mise-action@v4
        with:
          install: false

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      # **`merge-multiple: true` is what makes this layout knowable.**
      #
      # Without it, `download-artifact` decides the directory structure by how
      # many artifacts the pattern happened to match, and it does not decide it
      # the same way across versions. Under v4 a pattern always nested each
      # artifact under its own name. Under v8 — the README says it outright,
      # "this change also applies to patterns that only match a single
      # artifact" — a pattern matching exactly one extracts flat instead. This
      # repository publishes exactly one target, so the v4→v8 bump silently
      # moved every binary up a directory and `v1.1.0` died on
      # `cp: cannot stat 'artifacts/binary-aarch64-apple-darwin/claude-status'`,
      # after `test` and `build` had already spent their minutes.
      #
      # The trap in the default is worse than the breakage: the layout would
      # have flipped back to nested the moment a second target was added, so a
      # fix that merely matched today's shape would break again on the change
      # that `supported_targets` is designed to make a one-liner.
      #
      # Flattening deliberately is safe only because the staging step in `build`
      # gives every binary a target-unique filename; with the old
      # `claude-status`-for-everyone naming this would have silently overwritten
      # one target's binary with another's. The two changes go together.
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true

      # Put each binary back where the collect step below reads it, and restore
      # the executable bit — upload-artifact does not preserve it, and a
      # non-executable binary inside the tarball is a broken release.
      - name: Reassemble the build outputs
        run: |
          set -e
          # Driven by the same table the collect step reads, so adding a target
          # does not need this step edited too.
          .config/mise/tasks/_scripts/_rust_reassemble

      # Two assets per target from the one build, so the tarball and the raw
      # binary cannot disagree about what they contain.
      - name: Collect the release assets
        run: |
          set -e
          source .config/mise/tasks/_scripts/_rust
          mkdir -p release-assets
          while read -r target os cpu; do
            [ -z "$target" ] && continue
            # The count guard below cannot see a *mode*. `cp` and `tar` both
            # preserve whatever they are handed, so losing the `chmod` in
            # `_rust_reassemble` ships a 644 binary and a 644 tarball with the
            # job still green — the one failure downstream of reassemble that
            # is silent. Two comments already call that `chmod` load-bearing;
            # this is the line that makes them true.
            [ -x "target/$target/release/$BINARY_NAME" ] || {
              echo "::error::$target binary is not executable — the reassemble step's chmod is what restores it"
              exit 1
            }
            cp "target/$target/release/$BINARY_NAME" "release-assets/$(asset_name "$os" "$cpu")"
            # `reproducible_tar` and not `tar -czf`: the formula pins this
            # archive's digest, so a re-run that changes its bytes breaks
            # `brew install` at a stable URL with the run still green. The
            # helper pins the mtime, zeroes ownership and drops gzip's
            # timestamp; `_scripts/_rust` carries the reasoning. Its third
            # argument is the member name, and `-C` inside it is what puts the
            # binary at the archive ROOT rather than under a
            # `target/<triple>/release/` prefix — a formula's `bin.install`
            # reads the root and nothing else.
            reproducible_tar \
              "release-assets/$(asset_name "$os" "$cpu").tar.gz" \
              "target/$target/release" "$BINARY_NAME"
          done < <(supported_targets)
          # `--` and not `./*`: an asset whose name began with a dash would
          # otherwise be read as an option, but `./*` would write `./name` into
          # the manifest — and the formula's digest lookup matches the asset
          # name EXACTLY, so that would break `brew install` while the run
          # stayed green. `--` fixes the glob without touching the names.
          ( cd release-assets && shasum -a 256 -- * > SHA256SUMS )
          count="$(find release-assets -type f -not -name SHA256SUMS | wc -l | tr -d ' ')"
          expected="$(( $(target_count) * 2 ))"
          if [ "$count" != "$expected" ]; then
            echo "::error::collected $count assets, expected $expected"
            exit 1
          fi

      # This step IS the release now — there is no second destination behind it.
      # The tarball is what the Homebrew formula (`distribution/02`) will point
      # at; the raw binary and SHA256SUMS are for people who fetch by hand.
      # `--clobber` makes a re-run idempotent.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="v${{ needs.verify.outputs.version }}"

          # A release is only ever cut from a tag somebody pushed.
          #
          # The tag/crate agreement gate in `verify` is wrapped in
          # `if ref_type = tag`, and a `workflow_dispatch` runs against a
          # branch — so on a dispatch that gate is skipped entirely, and the
          # tag below is computed from Cargo.toml rather than read from the
          # ref. `gh release create` would then CREATE a tag nobody pushed,
          # pointing at whatever was dispatched. Worse once a formula pins the
          # digest: a dispatch from `main` would replace a live release's
          # assets with a fresh build.
          #
          # Re-running a real release is still supported — dispatch against the
          # tag ref itself, which is what this workflow's header describes.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::refusing to publish from a ${{ github.ref_type }} ref (${{ github.ref_name }}). A release is cut from a pushed tag; dispatch against the tag ref to re-run one."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — uploading assets to it."
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$tag" \
              --notes-file notes/RELEASE_NOTES.md
          fi

  # The tap moves only after the release exists, and reads back out of it.
  #
  # `needs: publish` is the whole design, not sequencing hygiene. The formula's
  # `url` and `sha256` are read from the release GitHub actually published,
  # rather than rebuilt from a version string here — so the tap can only ever
  # pin something that is genuinely being served.
  #
  # That closes the sharpest hazard in this cycle. A formula whose `url` names
  # an asset that does not exist is clean at every gate that exists: plain
  # `brew audit` does not fetch the URL, and `brew audit --strict` was measured
  # this cycle exiting 0 on a URL returning 404. It surfaces first as a failed
  # `brew install`, in front of the first user. Nothing is transcribed here, so
  # there is no name to get wrong.
  #
  # This job installs nothing, for the same reason `publish` does not: it runs
  # after the build has spent its minutes, and a tool download failing here is
  # a green release whose tap silently did not move. It needs `gh`, `awk`,
  # `sed` and `git`, all of which the runner image ships.
  bump-tap:
    needs: [ verify, publish ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Read the published release
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -e
          set -o pipefail
          source .config/mise/tasks/_scripts/_rust
          tag="v$VERSION"

          # Ground truth: what is attached to the release, not what we think
          # `asset_name` would have produced.
          gh release view "$tag" --json assets \
            --jq '.assets[] | select(.name | endswith(".tar.gz")) | [.name, .url] | @tsv' \
            > assets.tsv

          count="$(wc -l < assets.tsv | tr -d ' ')"
          # One target today. If a second is added, the formula grows a
          # per-arch block and this job must be taught about it — failing here
          # is how that gets noticed, rather than the tap silently pinning
          # whichever tarball sorted first.
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one .tar.gz asset on $tag, found $count — a formula bump cannot choose between them"
            exit 1
          fi

          name="$(cut -f1 assets.tsv)"
          url="$(cut -f2 assets.tsv)"

          gh release download "$tag" -p SHA256SUMS -O SHA256SUMS --clobber
          # Keyed on the exact published name. `digest_for` refuses a miss
          # rather than returning empty — an empty sha256 makes brew fall back
          # to a best-effort download instead of verifying anything.
          digest="$(digest_for SHA256SUMS "$name")"

          {
            echo "url=$url"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      # A GitHub App, not a deploy key and not a PAT.
      #
      # `GITHUB_TOKEN` cannot reach another repository at all, so pushing to the
      # tap needs a credential of its own. The three candidates differ in what
      # is sitting at rest in this repository's secrets:
      #
      #   PAT        — an account-level credential; can reach every repo the
      #                account can, and expires on a schedule somebody has to
      #                remember.
      #   deploy key — scoped to the tap, but a long-lived private key that can
      #                push to it forever.
      #   App        — nothing at rest can push anything. The secrets below
      #                only authorise MINTING a token, and the token itself is
      #                installation-scoped, valid for an hour, and revoked by
      #                the action when this job ends.
      #
      # `client-id` and not `app-id`: the action deprecates `app-id` and says
      # to use `client-id`. Note the secret holds the App's **Client ID**
      # (`Iv23…`), not the numeric App ID — same secret name, different value.
      #
      # `permission-contents: write` narrows the minted token below whatever
      # the installation was granted. If the App later gains other permissions,
      # a token minted here still cannot use them.
      - name: Mint a token for the tap
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}
          owner: virajp
          repositories: homebrew-tap
          permission-contents: write

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: virajp/homebrew-tap
          path: tap
          token: ${{ steps.tap-token.outputs.token }}

      - name: Rewrite the formula
        env:
          URL: ${{ steps.asset.outputs.url }}
          DIGEST: ${{ steps.asset.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        # Read through the environment, never interpolated into the script
        # body: `${{ }}` substitution happens before bash sees the text, so a
        # value containing shell syntax would execute rather than be assigned.
        run: |
          set -e
          source .config/mise/tasks/_scripts/_rust

          # The whole formula is rendered from this repo's template, not
          # patched in place over there. The tap is a generated artefact: it is
          # overwritten in full every release, so it cannot drift, and the
          # first release creates it rather than needing a hand-seeded file.
          #
          # The render lives in `_scripts/_rust` rather than inline here so
          # `tests/release.rs` can run it. A render that silently emitted the
          # template's own values is this job's quiet failure mode, and YAML
          # embedded in a workflow is the one place it could not be tested.
          render_formula \
            .config/homebrew/claude-status.rb \
            "$URL" "$DIGEST" \
            tap/Formula/claude-status.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `add` BEFORE the emptiness check. On the first release the formula
          # is a new file, and `git diff` does not see untracked paths — the
          # check would report "nothing to bump" and exit 0 having published
          # nothing, which is exactly the silent success this job must not have.
          # `diff --cached` after staging sees adds and modifications alike.
          git add Formula/claude-status.rb
          if git diff --cached --quiet; then
            echo "the formula already pins $VERSION — nothing to bump."
            exit 0
          fi

          git commit -m "claude-status $VERSION"
          git push

  # The npm package moves only after the release exists, and pins a digest read
  # back out of it. `bump-tap` is its sibling against a different registry.
  #
  # `needs: publish` is the design, not sequencing hygiene, and it is sharper
  # here than it is for the tap. The package carries NO BINARY — it is an
  # installer that fetches `claude-status-darwin-arm64.tar.gz` from this tag and
  # refuses it unless the bytes match a sha256 stamped in at publish time. A
  # published npm version is immutable, so a package pinned against a release
  # that did not exist yet could never be corrected, only superseded.
  #
  # **A failure here is not a broken release.** By the time this job runs,
  # `publish` has created the release and uploaded every asset, and nothing
  # below can modify either — this job's token is narrowed to `contents: read`
  # precisely so that stays true. Every failure path says so out loud, because a
  # red X on a release run reads as "the release failed" unless something tells
  # you otherwise. Re-run this job alone.
  #
  # **THIS WORKFLOW CANNOT PERFORM THE FIRST PUBLISH OF A PACKAGE NAME.** A
  # Trusted Publisher is configured on a package's settings page on npmjs.com,
  # and that page does not exist until the package does — so a name has to be
  # published once by hand, with a granular token, before OIDC can be registered
  # for it. Checked on 2026-08-27 rather than assumed: npm/cli#8544 ("Allow
  # publishing initial version with OIDC") is OPEN, and npm's own
  # trusted-publishers doc describes no path for a package that does not exist.
  # The mechanism is fine; only the first release of a new name is gated.
  #
  # **That bootstrap is one manual publish, and no more.** An earlier version of
  # this comment worried it might be worse: `drop-npm` recorded
  # `@askviraj/claude-status` as carrying a `0.0.1` placeholder, and a name that
  # was published and then unpublished is refused by npm for 24 hours and at
  # that exact version forever. **The concern was real and no longer applies** —
  # the package is `@virajp.dev/claude-status`, a name measured as never
  # published, so nothing about the old one's history reaches it. The old name
  # stays unreclaimed; see `docs/decisions.md`.
  #
  # The scope, not the name, is what a first publish actually needs: npm accepts
  # a scoped publish only under a scope its publisher owns.
  publish-npm:
    needs: [ verify, publish ]
    runs-on: ubuntu-24.04
    # Narrowed from the workflow's `contents: write`, which this job must not
    # have: it reads the release and may not touch it.
    #
    # `id-token: write` IS the trusted-publishing mechanism. npm exchanges this
    # run's OIDC identity — repository plus the ENTRY-POINT workflow's filename
    # — for a publish credential that lives as long as the request, so there is
    # no npm token at rest in this repository at all. That the identity names
    # the entry point is also why a publish can never be moved behind a
    # `workflow_call`: npm would see the caller, not this file.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # `install: false`, for the reason `publish` carries it: this job runs
      # after `test`, `build` and `publish` have spent their minutes, so a tool
      # download dying here is a shipped release with no npm package — the exact
      # shape of the 2026-08-22 failure. It needs nothing: the staging task is
      # bash, `sed` and `awk`, and `gh`, `node` and `npm` all ship in the runner
      # image.
      #
      # The one download below — `npm install -g npm@latest` — is deliberate and
      # different in kind. It comes from the registry this job exists to talk to,
      # so it cannot fail in a way the publish itself would have survived.
      - uses: jdx/mise-action@v4
        with:
          install: false

      # Ground truth for the digest: the manifest attached to the release that
      # was actually published, never one rebuilt here. Same source the tap
      # reads, so the two channels cannot pin different bytes for one tag.
      - name: Download the release's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -e
          gh release download "v$VERSION" -p SHA256SUMS -O SHA256SUMS --clobber

      # The injection lives in a task so it can be RUN outside CI —
      # `tests/release.rs` can execute a script and cannot execute YAML, and
      # this rewrite is the whole integrity story of the npm channel. Invoked by
      # path, like `_rust_reassemble`, because this job has no mise tools.
      #
      # `VERSION` is `verify`'s answer, which it computed from Cargo.toml and
      # refused the release unless the pushed tag agreed. The task falls back to
      # `crate_version()` when run by hand; either way no version is typed.
      - name: Stage the npm package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: .config/mise/tasks/release/npm-package SHA256SUMS

      # The staged package's OWN claim, checked against what the release
      # carries. A package whose installer names an asset that is not attached
      # is well-formed, publishes cleanly, and 404s for every user — the same
      # class of failure `docs/decisions.md` records for a formula url, where
      # `brew audit --strict` was measured exiting 0 against a url returning 404.
      #
      # Read back out of the staged file rather than recomputed here, so no
      # asset name is written down twice.
      #
      # Not piped into `grep -q`: `grep` exits at the first match and `gh` dies
      # of SIGPIPE, which under `pipefail` would fail the check on success.
      - name: Check the staged asset is one the release carries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -e
          asset="$(node -p "require('./target/npm/asset.json').name")"
          gh release view "v$VERSION" --json assets --jq '.assets[].name' > assets.txt
          if ! grep -qxF -- "$asset" assets.txt; then
            echo "::error::the staged package points at '$asset', which v$VERSION does not carry — every install on this channel would 404. v$VERSION IS RELEASED and unaffected."
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1 on node >= 22.14.0, per npm's
      # own docs, and the runner image's bundled npm may lag either. `@latest`
      # rather than a pin: the floor is the requirement, and there is nothing
      # here to reproduce byte for byte.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        env:
          # Read through the environment, never interpolated into the script
          # body, for the reason the tap's rewrite step gives: `${{ }}`
          # substitution happens before bash sees the text.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -e

          # A release is only ever cut from a pushed tag. `needs: publish`
          # already makes a branch dispatch unreachable — `publish` refuses
          # first, for the reasons its own guard spells out — and this says it
          # again anyway, at the point of no return. An npm version cannot be
          # replaced or unpublished, so relying on another job's guard costs
          # permanently and publicly if that guard is ever edited.
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::refusing to publish to npm from a $REF_TYPE ref ($REF_NAME). A release is cut from a pushed tag; dispatch against the tag ref to re-run one."
            exit 1
          fi

          # The name npm sees is the name in the staged manifest — nothing here
          # transcribes it.
          name="$(node -p "require('./target/npm/package.json').name")"
          # The INSTALLER's version, read from the staged manifest rather than
          # taken from `verify`. `verify`'s answer is the BINARY's — it is what
          # `gh release download` and the staging task above are pointed at —
          # and the two are separate release lines now. Publishing under the
          # binary's number would re-pin them to each other through this job,
          # which is exactly what splitting them undid.
          installer="$(node -p "require('./target/npm/package.json').version")"

          # Idempotent, which is this job's `--clobber`. An npm version cannot
          # be republished, so re-running a tag — the documented way to recover
          # a partly-failed release — must SKIP a version that is already there
          # rather than fail the run on it.
          if npm view "$name@$installer" version >/dev/null 2>&1; then
            echo "$name@$installer is already published — skipping."
            exit 0
          fi

          # `--access public`: a scoped package defaults to restricted, and a
          # restricted installer is one nobody can install.
          #
          # `--provenance` is explicit rather than load-bearing. npm generates
          # and publishes provenance attestations automatically for a
          # trusted-publisher publish and its docs say the flag is not needed;
          # it is passed so the intent is readable in the job rather than
          # inferred from the absence of a token.
          echo "Publishing $name@$installer, which installs v$VERSION ..."
          # `./target/npm`, and the `./` is load-bearing. npm reads a bare
          # `target/npm` as the GIT SHORTHAND `github:target/npm` — owner/repo
          # — not as a directory, and fails with EALLOWGIT before it ever
          # reaches the registry. Measured on the v1.1.1 run, which had passed
          # actionlint, shellcheck and the whole suite: nothing here executes
          # `npm publish`, so only a real tag could find it. Pinned by
          # `the_publish_command_names_the_staged_directory_as_a_path`.
          if ! npm publish --provenance --access public ./target/npm; then
            echo "::error::the npm publish of $name@$installer failed. v$VERSION IS RELEASED — the GitHub Release and its assets are complete and untouched by this job. If npm refused the version, npm/package.json was not bumped for this release — bump it and re-run this job alone; otherwise re-run it once npm is reachable, or once $name has had the one manual first publish a Trusted Publisher registration requires (see this job's comment)."
            exit 1
          fi
