name: Release

# Builds the binary and publishes it as GitHub Release assets. The release IS
# the distribution: per target a `.tar.gz` with the binary at its root — what a
# Homebrew formula consumes — plus the raw binary for people who want it
# directly, and a SHA256SUMS manifest covering both.
#
# Triggered two ways:
#   1. a pushed version tag (v*)   — the normal release path
#   2. workflow_dispatch           — manual re-run against an existing tag
#
# THERE IS NO REGISTRY STEP, and adding one back is a decision, not a fix. npm
# was the channel until `distribution/01` retired it: shipping a Rust binary
# through npm asked every user for a Node toolchain to deliver something that
# needs none, and made this repo two-language to serve one artifact. That is
# also why OIDC trusted publishing and `id-token: write` are gone — the only
# thing that ever needed them was the publish. See contract §9.
#
# ONE version. Cargo.toml owns it: the binary self-reports it, and `verify`
# below checks the tag against it before anything is built.
#
# `--clobber` on the upload path makes a re-run idempotent, so a partially
# failed release is safe to retry.
#
# To release: bump `version` in Cargo.toml, commit, then push a matching tag
# (e.g. v1.0.1).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  # `contents: write` creates the release and uploads the binaries to it. It is
  # the only permission this workflow needs, now that nothing publishes.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  # No test may reach the real spend endpoint: the credential store is not
  # scoped by $HOME, so a stray fetch is a privacy leak and a rate limit.
  CLAUDE_STATUS_SPEND_URL: http://127.0.0.1:1/never

jobs:
  # The tag has to agree with Cargo.toml before anything is built, so a
  # mismatched release fails in seconds rather than after both builds.
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      - name: Verify the tag matches Cargo.toml
        id: version
        run: |
          pkg="$(cargo pkgid | sed -E 's/.*[@#]([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/')"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $pkg"
              exit 1
            fi
          fi
          echo "Releasing claude-status $pkg"

  # The full suite once per **published architecture**, not once per OS. One
  # runner per row of `supported_targets` keeps every artifact that reaches a
  # release backed by a suite that ran on its own architecture. There is one row
  # today, so there is one runner — the rule has not changed, the table has.
  #
  # Re-adding a target means adding its runner here AND to the build matrix
  # below. Contract §9 makes that the bar for adding one at all: a target whose
  # binary is built but never executed is a claim nobody checked.
  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      # Cheap, and it guards the config that decides whether the lint below
      # even has a linter — which is how the first release failed.
      - name: Check the shared toolchain
        run: mise run code:toolchain

      - name: Lint
        run: mise run code:lint

      - name: Test
        run: mise run code:test

  # One target per natively-matching runner, so nothing is cross-compiled and no
  # C toolchain has to be arranged for the TLS stack the spend subsystem adds.
  # Kept in step with `supported_targets` in .config/mise/tasks/_scripts/_rust.
  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      - name: Build ${{ matrix.target }}
        run: mise run build:statusline --target ${{ matrix.target }}

      # The binary is what ships, so prove this exact file answers `--version`
      # with the bare crate version. This job is one of the two consumers that
      # make that guarantee load-bearing — `build:statusline`'s smoke test is
      # the other — and it is why contract §5 still pins the output's shape now
      # that the npm installer no longer reads it.
      - name: Verify the built binary
        run: |
          bin="target/${{ matrix.target }}/release/claude-status"
          reported="$("$bin" --version)"
          if [ "$reported" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::$bin reports $reported, expected ${{ needs.verify.outputs.version }}"
            exit 1
          fi
          echo "$bin -> $reported"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/claude-status
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ verify, test, build ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts

      # Put each binary back where the collect step below reads it, and restore
      # the executable bit — upload-artifact does not preserve it, and a
      # non-executable binary inside the tarball is a broken release.
      - name: Reassemble the build outputs
        run: |
          set -e
          # Driven by the same table the collect step reads, so adding a target
          # does not need this step edited too.
          .config/mise/tasks/_scripts/_rust_reassemble

      # Two assets per target from the one build, so the tarball and the raw
      # binary cannot disagree about what they contain.
      - name: Collect the release assets
        run: |
          set -e
          source .config/mise/tasks/_scripts/_rust
          mkdir -p release-assets
          while read -r target os cpu; do
            [ -z "$target" ] && continue
            cp "target/$target/release/$BINARY_NAME" "release-assets/$(asset_name "$os" "$cpu")"
            # `-C` is what puts the binary at the archive ROOT rather than under
            # a `target/<triple>/release/` prefix — a formula's `bin.install`
            # reads the root and nothing else.
            tar -czf "release-assets/$(asset_name "$os" "$cpu").tar.gz" \
              -C "target/$target/release" "$BINARY_NAME"
          done < <(supported_targets)
          ( cd release-assets && shasum -a 256 * > SHA256SUMS )
          count="$(find release-assets -type f -not -name SHA256SUMS | wc -l | tr -d ' ')"
          expected="$(( $(target_count) * 2 ))"
          if [ "$count" != "$expected" ]; then
            echo "::error::collected $count assets, expected $expected"
            exit 1
          fi

      # This step IS the release now — there is no second destination behind it.
      # The tarball is what the Homebrew formula (`distribution/02`) will point
      # at; the raw binary and SHA256SUMS are for people who fetch by hand.
      # `--clobber` makes a re-run idempotent.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="v${{ needs.verify.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — uploading assets to it."
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$tag" \
              --generate-notes
          fi
