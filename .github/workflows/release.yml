name: Release

# Publishes the binaries as GitHub Release assets, then @askviraj/claude-status
# to npm. ONE npm package: the binary is a release asset the installer fetches
# and verifies against bin/checksums.json, not a per-platform package.
# Triggered two ways:
#   1. a pushed version tag (v*)   — the normal release path
#   2. workflow_dispatch           — manual re-publish of an existing tag
#
# Auth is OIDC "trusted publishing" (no stored token) — npm verifies this repo +
# workflow's GitHub identity and adds provenance automatically. npm validates
# the ENTRY-POINT workflow's filename, so every publish path must enter through
# THIS file; `workflow_call` is unusable for that reason.
#
# One-time setup: on npmjs.com, register this repo + `release.yml` as the
# Trusted Publisher for @askviraj/claude-status. One package, one registration —
# the per-platform packages this used to need are gone.
#
# THIS WORKFLOW CANNOT PERFORM THE FIRST PUBLISH. A Trusted Publisher is
# configured on a package's settings page, which does not exist until the
# package does — so the package has to be created by hand, once, with a granular
# token, before OIDC can be registered. See npm/cli#8544.
#
# TWO VERSION LINES, deliberately and temporarily. The TAG and Cargo.toml are
# the BINARY's version and must agree, which `verify` enforces. The npm
# package's version is hand-set in npm/claude-status/package.json and is NOT
# derived from Cargo.toml, so a `0.x` installer can be republished while the
# fetch path is proven without burning binary versions. The installer finds its
# binary through bin/checksums.json, never through its own version.
#
# ORDER IS LOAD BEARING: the GitHub Release must exist BEFORE the npm publish.
# The published installer names a release to download from, so publishing npm
# first opens a window where every install 404s.
#
# To release: bump `version` in Cargo.toml, commit, then push a matching tag
# (e.g. v1.0.1).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# id-token: write is required for OIDC trusted publishing.
permissions:
  # `contents: write` creates the release and uploads the binaries to it.
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  # No test may reach the real spend endpoint: the credential store is not
  # scoped by $HOME, so a stray fetch is a privacy leak and a rate limit.
  CLAUDE_STATUS_SPEND_URL: http://127.0.0.1:1/never

jobs:
  # The tag has to agree with Cargo.toml before anything is built, so a
  # mismatched release fails in seconds rather than after both builds.
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      - name: Verify the tag matches Cargo.toml
        id: version
        run: |
          pkg="$(cargo pkgid | sed -E 's/.*[@#]([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/')"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $pkg"
              exit 1
            fi
          fi
          echo "Releasing claude-status $pkg"

  # The full suite once per **published architecture**, not once per OS. It used
  # to run on ubuntu-24.04 and macos-latest; the `macos-only` cycle removed the
  # Linux target, and dropping that runner would have left the published
  # x86_64-apple-darwin artifact with no coverage but `--version` — macos-latest
  # is arm64. One runner per row of `supported_targets` keeps every artifact
  # that reaches npm backed by a suite that ran on its own architecture.
  #
  # `macos-15-intel`, not `macos-13`: the hosted fleet retired the macOS 13
  # images, and the free x64 labels are now `macos-15-intel` / `macos-26-intel`
  # (the `-large` ones are billed). An unschedulable job under `fail-fast: true`
  # aborts the whole release.
  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: mise run code:lint

      - name: Test
        run: mise run code:test

  # One target per natively-matching runner, so nothing is cross-compiled and no
  # C toolchain has to be arranged for the TLS stack the spend subsystem adds.
  # Kept in step with `supported_targets` in .config/mise/tasks/_scripts/_rust.
  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      - name: Build ${{ matrix.target }}
        run: mise run build:statusline --target ${{ matrix.target }}

      # The binary is what ships, so prove this exact file answers `--version`
      # with the bare number the installer keys on.
      - name: Verify the built binary
        run: |
          bin="target/${{ matrix.target }}/release/claude-status"
          reported="$("$bin" --version)"
          if [ "$reported" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::$bin reports $reported, expected ${{ needs.verify.outputs.version }}"
            exit 1
          fi
          echo "$bin -> $reported"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/claude-status
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ verify, test, build ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: jdx/mise-action@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts

      # Put each binary back where build:installer expects it, and restore the
      # executable bit — upload-artifact does not preserve it.
      - name: Reassemble the build outputs
        run: |
          set -e
          # Driven by the same table build:installer reads, so adding a target does
          # not need this step edited too.
          .config/mise/tasks/_scripts/_rust_reassemble

      # tsup bundles the installer, so the build dependencies are needed here
      # too — `build:installer` refuses to stage without a bundle.
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage the npm package
        run: mise run build:installer

      # The binaries are what the release carries, and the manifest inside the
      # npm package is what vouches for them. Both come from this one staging
      # step, so they cannot disagree — but assert it anyway, because a silent
      # disagreement ships a package that 404s or refuses its own download.
      - name: Collect the release assets
        id: assets
        run: |
          set -e
          source .config/mise/tasks/_scripts/_rust
          mkdir -p release-assets
          manifest="target/npm/claude-status/bin/checksums.json"
          while read -r target os cpu; do
            [ -z "$target" ] && continue
            name="$(asset_name "$os" "$cpu")"
            cp "target/$target/release/$BINARY_NAME" "release-assets/$name"
            pinned="$(node -p "require('./$manifest').assets['$os-$cpu'].sha256")"
            actual="$(shasum -a 256 "release-assets/$name" | cut -d' ' -f1)"
            if [ "$pinned" != "$actual" ]; then
              echo "::error::$name is $actual but checksums.json pins $pinned"
              exit 1
            fi
          done < <(supported_targets)
          ( cd release-assets && shasum -a 256 * > SHA256SUMS )
          count="$(find release-assets -type f -not -name SHA256SUMS | wc -l | tr -d ' ')"
          if [ "$count" != "$(target_count)" ]; then
            echo "::error::collected $count assets, expected $(target_count)"
            exit 1
          fi
          echo "Collected $count assets"

      # BEFORE the npm publish — the published installer points at this release,
      # so it has to be there first. `--clobber` makes a re-run idempotent the
      # same way the npm publishes below are.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="v${{ needs.verify.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — uploading assets to it."
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$tag" \
              --generate-notes
          fi

      # OIDC trusted publishing needs npm >= 11.5.1; the bundled npm may lag.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      # The npm version is the PACKAGE's, read from the staged manifest — not
      # `verify.outputs.version`, which is the binary's and may differ while the
      # two lines are apart.
      #
      # Idempotent: an already-published version is skipped, not failed, so a
      # re-run or a partially-failed release is safe to retry. Republishing the
      # same npm version is impossible on npm, and this is what keeps that from
      # failing the whole job.
      - name: Publish the npm package
        run: |
          set -e
          version="$(node -p "require('./target/npm/claude-status/package.json').version")"
          if npm view "@askviraj/claude-status@$version" version >/dev/null 2>&1; then
            echo "@askviraj/claude-status@$version is already published — skipping."
            exit 0
          fi
          echo "Publishing @askviraj/claude-status@$version (binary ${{ needs.verify.outputs.version }}) ..."
          npm publish --access public target/npm/claude-status
