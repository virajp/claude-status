name: Site

# Builds claude-status.virajp.dev and deploys it to Cloudflare Workers Static
# Assets — the same shape as claude-plugins.virajp.dev: `site/wrangler.jsonc`
# names the Worker and its custom domain, and `wrangler deploy` uploads the
# built tree. It was a Cloudflare Pages project until 2026-09-18; see
# "WHY WORKERS AND NOT PAGES" below.
#
# What Cloudflare has to hold before a tag can deploy — the Worker, the
# domain, the token scope — is listed under "WHAT CLOUDFLARE HOLDS" at the
# bottom. The first `site-v*` tag after the move is the first to exercise the
# Workers deploy; until it runs, the deploy half of this file is the intended
# shape rather than a description of something that has happened.
#
# Triggered two ways, and they do different things:
#   1. a pushed `site-v*` tag   — build AND deploy
#   2. a pull request touching site/, or this file — build ONLY, no secrets
#
# ---------------------------------------------------------------------------
# WHY `site-v*` IS A PLAIN COUNTER
# ---------------------------------------------------------------------------
#
# `site-v1`, `site-v2`, `site-v3`. Nothing is encoded in the number; it exists
# to be different from the last one and to sort.
#
# The question this answers is "what do I tag to ship a typo fix", and it comes
# up monthly. Two alternatives were considered and rejected:
#
#   A DATE (`site-2026-08-24`) — collides the second time you ship twice in one
#   day, which is exactly the day you are fixing something you just broke. It
#   also invites a suffix convention, and then the suffix needs a rule.
#
#   MIRRORING Cargo.toml — would mean no documentation change can ship without
#   a binary version bump. That contradicts the entire reason this tag line is
#   separate from `v*`: the site is versioned apart from the binary so a docs
#   correction does not need a release.
#
# The site has no features to version and no consumer reads the number, so
# anything more expressive than a counter would be encoding meaning nobody
# consumes. The same reasoning is recorded in the cycle plan's Gaps section.
#
# `v*` and `site-v*` cannot collide. GitHub tag globs anchor at the start of
# the ref name, so `v*` never matches `site-v1` — a binary release triggers
# release.yml and this workflow stays asleep, which is acceptance criterion 3.
#
# ---------------------------------------------------------------------------
# WHY WORKERS AND NOT PAGES
# ---------------------------------------------------------------------------
#
# The site shipped on Cloudflare Pages first (direct upload, `wrangler pages
# deploy --project-name=claude-status-virajp-dev`, no config file). It moved to
# Workers Static Assets so the two `*.virajp.dev` sites deploy the same way:
# one `wrangler.jsonc` beside the site naming the Worker and its custom domain,
# one `wrangler deploy`. Pages and Workers serve a static tree identically —
# `_headers` at the root of the output, `404.html` for the miss, the same
# trailing-slash handling — so nothing `site:build` emits changed.
#
# ---------------------------------------------------------------------------
# WHY NOT CLOUDFLARE'S GIT INTEGRATION
# ---------------------------------------------------------------------------
#
# Because it deploys on a branch push and cannot be gated on a tag. Wiring the
# Worker to the repository would make every merge to main a production deploy
# and delete the whole point of the tag line.
#
# ---------------------------------------------------------------------------
# WHY `wrangler-action` AND NOT A PINNED wrangler
# ---------------------------------------------------------------------------
#
# `mise registry wrangler` resolves to `npm:wrangler` and nothing else. Pinning
# it would put Node back in a tree that spent `distribution/01` removing it,
# plus three native builds (`esbuild`, `sharp`, `workerd`) that mise would have
# to be told to allow. `cloudflare/wrangler-action@v4` keeps Node on the runner
# where it is already installed and out of the repository entirely.
#
# The site itself is built by zola, a single static Rust binary pinned in
# .config/mise.toml — so the *tree* stays single-language even though the
# deploy step is not.
#
# ---------------------------------------------------------------------------
# WHAT CLOUDFLARE HOLDS
# ---------------------------------------------------------------------------
#
#   1. The Worker `claude-status-virajp-dev` — named after the domain, so the
#      two are identifiable as a pair. `site/wrangler.jsonc` is the one place
#      that name is written; the first `wrangler deploy` creates the Worker.
#   2. `claude-status.virajp.dev`, declared as a custom-domain route in that
#      file, so the deploy attaches it. The hostname has to be free — released
#      from the retired Pages project — before the first Workers deploy can
#      claim it.
#   3. Both repository secrets — `gh api
#      repos/virajp/claude-status/actions/secrets` lists CLOUDFLARE_ACCOUNT_ID
#      and CLOUDFLARE_API_TOKEN. The token needs "Workers Scripts: Edit" on the
#      account and, for the custom domain, "Workers Routes: Edit" on the
#      virajp.dev zone — the Pages-only token the site launched with cannot
#      create a Worker. That scoping is not checkable from here; the secret's
#      value is write-only to the API.
#
# Until step 3 is done the deploy job will fail on an unauthorised token rather
# than doing something surprising, which is the failure mode to want.

on:
  push:
    tags:
      - "site-v*"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - ".config/mise.toml"
      # The config generator builds its form from these two files, staged into
      # `site/static/` by `site:assets`. Without them here, a pull request that
      # renamed a config key or changed a shipped default would never rebuild
      # the page that renders it — the first sign would be a deployed form
      # describing a schema the binary no longer has.
      # `tests/site.rs` asserts on this list, so it cannot narrow quietly.
      - "schemas/**"
      - "assets/claude-status.defaults.json"
      # The agent runbook, staged to `/install.md` by `site:assets`. It is the
      # one page whose content lives outside `site/`, so without this line an
      # edit to it would never reach the deployed copy every install prompt
      # fetches.
      - "install.md"
      - ".config/mise/tasks/site/**"
  workflow_dispatch: {}

permissions:
  # Read-only. Nothing here creates a release, writes to the repository or
  # needs an id token — the deploy authenticates to Cloudflare with a secret,
  # not with OIDC.
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci

jobs:
  # Runs for BOTH triggers, and is the only job a pull request gets. This is
  # the repository's first PR CI of any kind: `code:lint` and `code:test` run
  # on tags and on `workflow_dispatch` via release.yml, and have never run on a
  # pull request. Widening that to the Rust suite is a separate decision and
  # deliberately not made here.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs zola from .config/mise.toml. It is in the BASE config and not
      # mise.dev.toml precisely so this line works — `MISE_ENV=ci` does not
      # load the dev file.
      - uses: jdx/mise-action@v4

      # Builds into site/public/ and then runs `zola check
      # --skip-external-links`, which is the internal-link gate. See the task
      # for why the build itself is the check and no crawler is pinned.
      - name: Build the site
        run: mise run site:build

      # Handed to the deploy job below rather than rebuilt there, so the bytes
      # that were checked are the bytes that ship. On a pull request nothing
      # downloads it and it expires.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/public
          if-no-files-found: error
          retention-days: 1

  # Tag only. A pull request never reaches this job, so a fork PR cannot
  # deploy and cannot see a secret — acceptance criterion 4.
  # The site is user-facing production, so a `site-v*` tag ships from `main` on
  # the same terms a `v*` tag does. This costs a `develop` -> `main` merge before
  # a typo fix can deploy — the site's separate tag line still means it does not
  # need a *binary release*, which is what that line was always for.
  #
  # Its own job rather than a step in `build`, so a pull-request build stays a
  # shallow checkout and the gate sits immediately before the deploy it guards.
  gate:
    if: startsWith(github.ref, 'refs/tags/site-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # `release.yml`'s reasoning, unchanged: `--is-ancestor` allows a tag that
      # sits behind `main`, and the explicit fetch is what puts `origin/main` in
      # the repository at all after a checkout at a tag ref.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main — merge develop into main, then re-cut the tag"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is contained in main"

  deploy:
    needs: [ build, gate ]
    if: startsWith(github.ref, 'refs/tags/site-v')
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://claude-status.virajp.dev
    steps:
      - uses: actions/checkout@v7

      # Lands where `site:build` writes and `site/wrangler.jsonc` points.
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/public

      # `wrangler-action` installs wrangler on the runner for the length of the
      # step. Nothing about it is committed to this repository except
      # `site/wrangler.jsonc`, which is what `deploy` reads: the Worker name,
      # the assets directory and the custom domain all come from there, so the
      # workflow names none of them.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      - name: Where it went
        run: echo "Deployed ${GITHUB_REF_NAME} to
          https://claude-status.virajp.dev"
