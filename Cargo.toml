[package]
edition = "2024"
name    = "claude-status"
version = "1.1.3"         # the binary's version, and the tag `verify` gates on

# An integration test in tests/ cannot link a bin target, so the golden and
# defaults tests need the library.
[lib]
name = "claude_status"
path = "src/lib.rs"

[[bin]]
name = "claude-status"
path = "src/main.rs"

# The schema generator. `required-features` is what keeps it out of every
# ordinary build: `cargo build --release` does not compile this target, so the
# shipped artifact is one binary as it has always been.
[[bin]]
name              = "schema"
path              = "src/bin/schema.rs"
required-features = [ "schema" ]

[dependencies]
# `worktreePattern` and (plan 2) `subagent.statuses[].match`. The full `regex`
# crate is ~1.5 MB and builds a DFA on a per-render path.
regex-lite = "0.1.9"

# `derive`, for the config types only. The payloads stay untyped — every field
# of every payload is optional and a derive would buy nothing there — but the
# merged *config* is deserialized once into named Rust types, because the code
# has to be able to name a default. `serde_core` already pulls `serde_derive`
# in for `serde_json`, so the macro is compiled either way.
serde = { default-features = false, features = [
"derive",
"std",
], version = "1.0.229" }

# The single network call, in a detached refresh child — never on the render
# path. No async runtime: one blocking request cannot justify tokio against the
# startup-time argument that motivated this rewrite. rustls rather than
# native-tls, whose openssl-sys on linux-gnu would need headers at build time
# and a versioned libssl.so at run time, ending the single-binary distribution
# story.
#
# `platform-verifier` pulls `rustls-platform-verifier`, which hands certificate
# verification to the OS — the macOS Security framework here. **It replaces the
# baked webpki roots, and that is the point**: webpki carries Mozilla's root
# set and nothing else, so a corporate TLS-intercepting proxy — whose root is
# installed in the login keychain by MDM, and which every other tool on the
# machine therefore trusts — failed with
# `invalid peer certificate: UnknownIssuer` and no way for the user to fix it.
# The reason for the ban on native-tls is unaffected: this is still rustls, and
# still links no openssl. See
# [The spend fetch trusts the OS, not a baked root set](docs/decisions.md#the-spend-fetch-trusts-the-os-not-a-baked-root-set).
ureq = { default-features = false, features = [
"platform-verifier",
"rustls",
], version = "3.4" }

# Untyped `Value` parsing, the deep merge, cache/mirror serialisation, and the
# one `from_value` that turns the merged config into types. `std` must stay
# listed explicitly — `preserve_order` does not imply it once default features
# are off.
#
# `preserve_order` (via indexmap) is **not a convenience**. It carries two
# separate behaviours, and dropping it would break both silently:
#
# 1. It keeps "statuses are tried in config order" true — a `BTreeMap`-shaped
#    map would re-rank a user's subagent buckets, and the shipped order is
#    alphabetical only by coincidence, so every golden would still pass.
# 2. `--configure` read-modify-writes `~/.claude/settings.json`, a file this
#    tool owns three keys of. Without ordered maps that write would
#    **alphabetise the user's entire Claude Code configuration**. It is what
#    makes the cycle's criteria 1 and 3 reachable at all.
#
# Both are covered: `settings::tests::unrelated_keys_survive_with_their_values_
# and_their_order` asserts the order of a user's keys directly, and goes red if
# this feature is removed.
serde_json = { default-features = false, features = [
"std",
"preserve_order",
], version = "1.0.151" }

# The JSON-schema generator, and the **only** optional dependency. It is a
# genuine `[dependencies]` entry rather than a dev-dependency because a
# dev-dependency cannot back a `derive` on a *library* type — the derive
# expands in the lib crate, where a dev-dependency is not in scope, and
# `optional = true` is rejected outright on a dev-dependency. The `schema`
# feature is off by default, so `cargo tree -e normal` on a release build shows
# no schemars and the shipped binary carries none.
schemars = { optional = true, version = "1.2" }

[features]
# Author-time only: turns on the `JsonSchema` derives and the generator behind
# `cargo run --features schema --bin schema`. Nothing in the render path reads
# it, and no default feature enables it.
schema = [ "dep:schemars" ]

[dev-dependencies]
# Draft-2020-12 validation, for the tests that hold the committed schema to
# being a schema — criterion 9. Chosen over `jsonschema` for the dependency
# weight: this crate is the only third-party validator in the tree and it must
# not become a reason CI is slow.
boon     = "0.6"
tempfile = "3"   # throwaway $HOME for the e2e tests

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = "s"
# Load-bearing: under `abort`, `catch_unwind` cannot catch, the fallback line is
# never printed and the bar renders blank — which breaks the contract's third
# invariant ("a render never fails visibly").
panic = "unwind"
strip = "symbols"
