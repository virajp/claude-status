default_install_hook_types:
  - pre-commit
  - commit-msg

# Generated output that no hook may rewrite.
#
# graphify-out/ holds generated output. Two files under it are tracked so the
# map is shareable, but no hook may rewrite them: graphify writes them without
# a trailing newline, so end-of-file-fixer would "fix" every commit and the
# next rebuild would undo it, forever. Regenerate with graphify, never format.
#
# tests/golden/ holds rendered status bars — raw ANSI, Nerd Font private-use
# codepoints, and no trailing newline, because the renderer emits none. A hook
# that appends one makes every golden fail. Regenerate with
# `UPDATE_GOLDEN=1 cargo test --test golden`.
exclude: ^(graphify-out/|tests/golden/)

repos:
  - repo: local
    hooks:
      - id: mise-toolchain
        name: Shared mise tools live in one file
        description: Fails if an environment config redeclares a tool the base
          config owns — the silent override that made CI lint without a linter.
        entry: mise x -- mise run code:toolchain
        language: system
        pass_filenames: false
        files: ^\.config/mise(\.(dev|ci))?\.toml$
        stages: [ pre-commit ]

      - id: git-config
        name: Forbidden Local git-config
        description: Prevents local .git/config from overriding global user and
          signing settings.
        entry: mise x -- mise run code:git-config --fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-shebang-scripts-are-executable
        name: Check that scripts with shebangs are executable
        stages: [ pre-commit ]
      - id: check-executables-have-shebangs
        name: Check that executables have shebangs
        stages: [ pre-commit ]
      - id: check-merge-conflict
        name: Check for merge conflicts
        stages: [ pre-commit ]
      - id: end-of-file-fixer
        name: Ensure files end with a newline
        stages: [ pre-commit ]
      - id: trailing-whitespace
        name: Remove trailing whitespace
        stages: [ pre-commit ]
      - id: check-added-large-files
        name: Check for added large files (>1MB)
        args: [ "--maxkb=1024" ]
        stages: [ pre-commit ]
      - id: check-symlinks
        name: Check for broken symlinks
        stages: [ pre-commit ]
      - id: destroyed-symlinks
        name: Check for destroyed symlinks
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: schema-drift
        name: JSON schema is generated from the config types
        description: Fails if schemas/claude-status.schema.json is not what the
          Rust config types produce. It runs unconditionally and takes no file
          list, because the *cause* of a drift is a change under src/ — a hook
          scoped by a schemas/ path filter would never fire for the commit that
          broke it.
        entry: mise x -- mise run code:schema --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: actionlint
        name: Lint GitHub workflows
        description: The release workflow only runs on a tag, so a mistake in it
          is normally found by cutting a release. This reads it statically, and
          shells out to shellcheck for every `run:` block. Suppressions live in
          .github/actionlint.yaml, which is also what `code:lint` reads, so the
          hook and the CI gate cannot disagree.
        entry: mise x -- actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: shellcheck
        name: Lint the task library
        description: Every mise task is a bash file, and they are the least
          reviewed code here. `-x` follows the sourced `_scripts/` libraries so
          they are analysed as the callers actually see them. Scoped by path
          rather than run always, because `code:lint` already covers the whole
          set on CI and this only needs to catch the file being committed.
        entry: mise x -- shellcheck -x
        language: system
        files: ^\.config/mise/tasks/
        exclude: \.md$
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: formatter
        name: Formatter
        entry: |
          mise x -- dprint fmt \
            --config dprint.json \
            --allow-no-files \
            --log-level warn
        language: system
        stages: [ pre-commit ]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Check for secrets
        args: [ --config, .config/gitleaks.toml ]
        stages: [ pre-commit ]

  - repo: https://github.com/qoomon/git-conventional-commits
    rev: v2.9.0
    hooks:
      - id: conventional-commits
        name: Conventional Commits
        args: [ "--config", ".config/git-conventional-commits.yaml" ]
        stages: [ commit-msg ]
