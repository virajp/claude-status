# grype's config. The scan itself is wired in `.config/mise/tasks/code/sec`,
# which passes `--fail-on medium` — anything medium or above fails the commit
# and fails CI. Low and negligible are reported and do not block.
#
# **An ignore rule here is a claim that a finding is wrong, not that it is
# inconvenient.** Each one must say why, and must name what would make it
# expire. A rule with no expiry condition is how a real finding gets silenced
# for a year.

# **There are none, and that is the intended state.**
#
# The one rule this file ever carried suppressed GHSA-cxww-7g56-2vh6 against
# `actions/download-artifact@v4`. It was deleted on 2026-08-27 when the
# workflows moved to `@v8` for an unrelated reason — Node 20 — and the finding
# went away on its own: grype reports **zero** matches against the tree now,
# measured before and after the bump rather than assumed.
#
# Its stated reasoning was also wrong, which is worth more than the rule was.
# See [The download-artifact ignore rule was deleted, and its reasoning was
# wrong](../docs/decisions.md#the-download-artifact-ignore-rule-was-deleted-and-its-reasoning-was-wrong).
#
# An empty list rather than a deleted key: the file is the documented home for
# the next rule, and the paragraph above it is the bar that rule has to clear.
ignore: []
