---
# grype's config. The scan itself is wired in `.config/mise/tasks/code/sec`,
# which passes `--fail-on medium` — anything medium or above fails the commit
# and fails CI. Low and negligible are reported and do not block.
#
# **An ignore rule here is a claim that a finding is wrong, not that it is
# inconvenient.** Each one below says why, and names what would make it
# expire. A rule with no expiry condition is how a real finding gets silenced
# for a year.

ignore:
  # FALSE POSITIVE — grype is comparing a floating tag against a version.
  #
  # `actions/download-artifact@v4` is a *mutable major tag*: GitHub repoints it
  # at each new v4.x, so a workflow saying `@v4` runs the newest v4 release.
  # That is far past the 4.1.3 this advisory names — the action is on v8 now.
  # grype reads the literal string "v4", cannot order it against "4.1.3", and
  # reports the advisory as unfixed.
  #
  # Verified 2026-08-27 rather than assumed: `gh api
  # repos/actions/download-artifact/git/ref/tags/v4` resolves to a commit, and
  # the latest release is v8.0.1.
  #
  # **Floating tags are a deliberate choice, retaken on 2026-08-27**: patches to
  # an action reach us without anybody editing a workflow. The cost is that this
  # advisory cannot be resolved by upgrading, because there is nothing to
  # upgrade — hence the rule rather than a version bump.
  #
  # WHAT MAKES THIS EXPIRE: pinning the actions to exact versions or SHAs. Then
  # grype can read a real version and this rule is not only unnecessary but
  # actively hides whatever the pinned version is vulnerable to. Delete it in
  # the same change that pins.
  - vulnerability: GHSA-cxww-7g56-2vh6
    package:
      name: actions/download-artifact
      type: github-action
