[settings]
activate_aggressive  = true     # let mise shims win on PATH
all_compile          = false
env_shell_expand     = true     # expand $VARS in [env]
gpg_verify           = true     # verify tool signatures
raw                  = true     # streams output
status.missing_tools = "always"

# Every tool dev and CI both need, resolved identically in both. Rust, and the
# site's generator — `distribution/01` deleted the npm installer, and node and
# pnpm left with it, because the only thing a second language was here to do was
# deliver a binary that needs none. Tools only one environment uses live in
# mise.dev.toml; mise.ci.toml holds CI-only additions and production env VALUES.
#
# `profile = "default"`, not `minimal`. The two environments run the same
# `code:*` tasks, and `code:lint` is clippy, which `minimal` does not carry.
# This config used to say `minimal` while mise.dev.toml quietly overrode it to
# `default` — so a maintainer's machine had clippy and CI did not, and the first
# release failed on exactly that. The cost of `default` is clippy and rustfmt
# downloaded everywhere; the benefit is that "works locally" and "works in CI"
# stop being different questions about the toolchain. Do not narrow this back
# without moving the lint out of CI first.
#
# `zola` builds docs/../site/ and belongs in the BASE, not mise.dev.toml: the
# site workflow runs under `MISE_ENV=ci`, which does not load the dev file, and
# a tool declared in both files fails the `mise-toolchain` pre-commit hook. It
# is a prebuilt static Rust binary from `aqua:getzola/zola` with an upstream
# attestation mise verifies — it links nothing but system libraries and brings
# no runtime, which is the only reason a second generator was allowed back into
# a tree that just finished removing one. Pinned exactly, not `latest`: 0.23
# renamed the `[markdown]` highlighting keys, so a floating version would break
# the build on an upgrade nobody asked for.
#
# **Everything here tracks `latest`, deliberately.** That is the convention
# across this author's projects: take upgrades as they land and fix forward when
# one breaks, rather than carrying a pin that quietly goes stale and gets bumped
# without anyone reading the changelog either way.
#
# The zola note above is the shape of the risk, not an argument against the
# policy — 0.23 renaming the `[markdown]` keys is exactly the kind of break that
# gets fixed when it happens. `latest` is 0.23.4 today.
#
# The one consequence worth knowing: `code:lint` is clippy with `-D warnings`
# and it gates the release path, so a stable rustc landing between two runs can
# fail a release whose code did not change. The remedy is the same — fix
# forward. It is recorded in `03-release`'s Risks so nobody rediscovers it
# mid-tag.
#
# `npm:wrangler` is a deploy-time tool for Cloudflare Pages and does not enter
# the binary, the release path, or any tracked manifest — the no-JS-toolchain
# guard (`tests/site.rs`) still passes, because it scans tracked lockfiles,
# manifests and `node_modules`, none of which this adds.
[tools]
"core:rust"    = { profile = "default", version = "latest" }
"npm:wrangler" = { allow_builds = [ "esbuild", "workerd" ], version = "latest" }
zola           = { version = "latest" }
# In the BASE and not `mise.dev.toml`, for the same reason zola is: the test
# suite shells out to it (`tests/schema.rs`'s formatting check) and that suite
# runs under `MISE_ENV=ci`, which never loads the dev file. It was declared in
# dev until the first release attempt failed on a runner that did not have it.
dprint = { version = "latest" }

# In the BASE for exactly the reason dprint is, and found the same way — by a
# runner failing on a tool a maintainer's machine had. `taplo` is dprint's TOML
# formatter, invoked through an `exec` plugin, so without it `code:format`
# cannot process a single `.toml` and `code:all` dies before it lints. It sat
# in `mise.dev.toml` until CI started running the formatter on 2026-08-27.
#
# `gitleaks` and `grype` are `code:sec`, which `code:all` runs last and CI now
# runs on every push.
gitleaks = { version = "latest" }
grype    = { version = "latest" }
taplo    = { version = "latest" }

# Generates the release notes from the commit history, using the changelog
# block in `.config/git-conventional-commits.yaml` that already describes the
# headlines and URLs this project wants. In the BASE because `verify` runs it
# on a runner. The same config is what the pre-commit hook validates messages
# against, so the notes and the rules that shape them cannot drift apart.
"npm:git-conventional-commits" = { version = "latest" }

# The other half of the lint gate: clippy covers the Rust, these two cover
# everything else this repo actually ships logic in — the release workflow and
# the bash task library. In the BASE for the same reason dprint is: `code:lint`
# runs on a CI runner under `MISE_ENV=ci`, which never loads the dev file.
#
# They earn their place. actionlint found `shasum -a 256 *` in the collect step
# (an asset named `-x` would have been read as an option) and shellcheck found
# that every optional-flag variable in the task library relied on word-splitting
# to disappear.
actionlint = { version = "latest" }
shellcheck = { version = "latest" }

[tasks.init]
# Mandatory — chmod the file-based tasks under .config/mise/tasks/ executable.
# Lives in the BASE (not dev) so tasks are runnable in every env, CI included.
description = "Initialize mise tasks"
hide        = true
run         = "find .config/mise/tasks/ -name '*' -type f -not -path '*/*.env' -exec chmod 755 {} \\;"

[env]
# Personal Account ID in Cloudflare
CLOUDFLARE_ACCOUNT_ID = "56702e03820fd6b69ff032c468913b23"
