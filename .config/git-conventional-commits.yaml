---
convention:
  commitTypes:
    - feat # a new feature
    - fix # a bug fix
    - perf # code change that improves performance
    - refactor # code change that neither fixes a bug nor adds a feature
    - test # test, unit test, integration test, etc.
    - docs # documentation, README, CHANGELOG, etc.
    - ops # .config, .claude, .vscode, folder
    - blueprint # a blueprint, plan, or specification
    - merge # a merge commit
    - wip # work in progress, not yet ready for review
  commitScopes:
    # the binary's modules, mirroring src/
    - cli # argument surface, stdin routing, the stdout boundary
    - config # the three config layers, deep merge, colour resolution
    - render # powerline seams, segments, the main bar
    - subagent # the NDJSON subagent panel
    - spend # cache, lock, refresh child, credentials, the four gates
    - git # filesystem-first root/branch, bounded dirty and ahead markers
    - usage # the session usage mirror consumed by ai-plugins
    - caps # the PostToolUse context/rate-limit hook
    # everything else
    # `installer` is a dead scope — `distribution/01` deleted the npm channel it
    # named. It stays listed so the commits that used it remain valid under this
    # config; nothing new should reach for it.
    - installer # npm platform packages, install/uninstall, receipts
    - plans # ./docs/plans
    - site # ./site — the zola sources behind claude-status.virajp.dev
    # `spec` is a dead scope, on the same terms as `installer` above —
    # `spec-retirement` deleted ./docs/spec, including the commits of that cycle
    # which used this scope. It stays listed so they remain valid; use
    # `decisions` for what replaced it.
    - spec # ./docs/spec — deleted
    - decisions # ./docs/decisions.md, ./docs/usage-mirror-contract.md

changelog:
  commitTypes:
    - feat
    - fix
    - perf
    - refactor
  includeInvalidCommits: false
  commitIgnoreRegexPattern: '^[wW][iI][pP]\b'
  headlines:
    feat: Features
    fix: Bug Fixes
    perf: Performance Improvements
    refactor: Refactors
    merge: Merges
    breakingChange: BREAKING CHANGES

  # GitHub
  commitUrl: https://github.com/virajp/claude-status/commit/%commit%
  commitRangeUrl: https://github.com/virajp/claude-status/compare/%from%...%to%?diff=split

  # GitHub Issues
  issueRegexPattern: "#[0-9]+"
  issueUrl: https://github.com/virajp/claude-status/issues/%issue%
