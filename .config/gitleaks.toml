# Gitleaks — the secret scanner run by the pre-commit hook and `code:sec`.
#
# `useDefault = true` is load-bearing, and its absence was a real hole. A
# `--config` file REPLACES gitleaks' built-in ruleset rather than adding to it,
# so without this line the two custom rules below were the *entire* scan: an
# AWS access key that the default ruleset flags passed both the hook and
# `code:sec` cleanly. `extend` is what puts the ~170 default rules back and
# makes the rules below additions rather than a replacement.
[extend]
useDefault = true

[[rules]]
description = "RevenueCat public API key"
id          = "revenuecat-api-key"
regex       = '''(apple_|google_)[A-Za-z0-9]{20,}'''
tags        = [ "api-key", "revenuecat" ]

[[rules]]
description = "Grafana Cloud API key"
id          = "grafana-cloud-api-key"
regex       = '''glc_[A-Za-z0-9+/]{40,}'''
tags        = [ "api-key", "grafana" ]

# **Generated and gitignored trees, which `gitleaks dir` walks anyway.**
#
# `dir` mode scans the filesystem and does NOT honour `.gitignore`, so
# everything a tool drops in the working copy is in scope. That is harmless
# until `useDefault` above is on: the default ruleset's `generic-api-key` rule
# fires on any long high-entropy string, and a cache index full of hashes is
# exactly that. `graphify-out/cache/stat-index.json` tripped it the moment the
# default rules came back, failing `code:sec` on every machine that has run
# graphify -- for a hash, not a credential.
#
# Listed by path because gitleaks has no "ask git" option. Each entry is a tree
# nothing commits and nobody reviews; a real secret in one of them would be a
# secret in a build artifact, which is a different problem than this scanner is
# for. Keep this list to trees that are gitignored -- widening it to tracked
# source is how a scanner quietly stops scanning.
[allowlist]
paths = [
'''node_modules/*''',
'''graphify-out/*''',
'''docs/scratchpad/*''',
'''docs/memory/*''',
'''target/*''',
'''site/public/*''',
]
