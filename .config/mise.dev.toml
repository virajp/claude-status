[settings]
env_shell_expand     = true
status.missing_tools = "always"

[tools]
"core:rust" = { profile = "default", version = "latest" }
dprint      = { version = "latest" }
gitleaks    = { version = "latest" }
grype       = { version = "latest" }
pre-commit  = { version = "latest" }
taplo       = { version = "latest" }

# No cross-compilation toolchain is pinned. Both published targets are macOS,
# and `rustup target add` is the whole story on a Mac — see build:cross.

[shell_alias]
cc        = "claude --name 'claude-status' --allow-dangerously-skip-permissions --dangerously-skip-permissions --remote-control 'claude-status' --continue"
ccf       = "claude --name 'claude-status' --model 'fable[1m]' --effort 'high' --allow-dangerously-skip-permissions --dangerously-skip-permissions --remote-control 'claude-status' --continue"
cco       = "claude --name 'claude-status' --model 'opus[1m]' --effort 'high' --allow-dangerously-skip-permissions --dangerously-skip-permissions --remote-control 'claude-status' --continue"
precommit = "mise run code:precommit"
setup     = "mise run setup:all"

[env]
PRE_COMMIT_HOME = "$HOME/.cache/pre-commit"
